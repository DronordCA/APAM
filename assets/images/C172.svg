  <circle cx="101" cy="220" r="9" fill="#4a555e" stroke="#8a97a2" stroke-width="2"/>
  <circle cx="320" cy="222" r="11" fill="#4a555e" stroke="#8a97a2" stroke-width="2"/>
  <circle cx="282" cy="222" r="11" fill="#4a555e" stroke="#8a97a2" stroke-width="2"/>
  <!-- Cheatline -->

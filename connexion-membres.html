<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/apam-logo2.png" />
  <link rel="shortcut icon" href="assets/images/apam-logo2.png" />
  <title>APAM – Connexion membres</title>
  <style>
    :root{--accent:#2f6bff;--line:rgba(255,255,255,.16);--bg:#11131a;--surface:rgba(20,22,34,.92);}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100svh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top right,#203768,#11131a 44%);color:#fff;padding:20px;}
    .panel{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);padding:28px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
    h1{font-size:36px;line-height:1.05;text-transform:uppercase;letter-spacing:-.02em;margin-bottom:10px}
    p{color:rgba(255,255,255,.76);line-height:1.5;margin-bottom:18px}
    form{display:grid;gap:12px}
    label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.8)}
    input{width:100%;padding:12px;border:1px solid var(--line);background:#0f1220;color:#fff}
    button{padding:12px 14px;border:1px solid rgba(123,166,255,.55);background:linear-gradient(135deg,#2f6bff,#183775);color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
    .status{margin-top:14px;font-size:13px;min-height:20px;color:#bcd2ff}
    .help{margin-top:14px;font-size:12px;color:rgba(255,255,255,.63)}
    a{color:#c8dbff}
  </style>
</head>
<body>
  <main class="panel" data-access-api="https://script.google.com/macros/s/AKfycbxmzpzMhv5wEaSajCkNYu6bpQbqwkb7klq029Yjo_3KNKMmyTtNdSEF_R0vgAUK9_-9/exec">
    <h1>Connexion membres</h1>
    <p>Entrez votre email APAM pour recevoir un lien de connexion sécurisé. Une fois le lien validé, vous serez redirigé vers l'espace membres.</p>

    <form id="loginForm" novalidate>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <button type="submit">Recevoir mon lien de connexion</button>
    </form>

    <div class="status" id="status" aria-live="polite"></div>
    <p class="help">Besoin d'un compte ? <a href="inscription-membres.html">Remplissez le formulaire d'inscription interne APAM</a>.</p>
    <p class="help"><a href="index.html">← Retour à l'accueil</a></p>
  </main>

  <script src="assets/access-config.js"></script>

  <script>
    const panel = document.querySelector('[data-access-api]');
    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const next = (params.get('next') || window.localStorage.getItem('apam_login_next') || 'mon-compte.html').replace(/^\//, '');

    function setStatus(message){
      if (status) status.textContent = message;
    }

    async function consumeMagicLinkIfNeeded(){
      const apiUrl = String(window.APAM_ACCESS_API_URL || panel?.dataset.accessApi || '').trim();
      const token = String(params.get('token') || '').trim();
      if (!token || !apiUrl) return;

      setStatus('Validation du lien en cours...');

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'consume_magic_link', token })
        });
        const payload = await res.json();
        const sessionToken = String(payload.sessionToken || payload.token || '').trim();
        if (!res.ok || !payload.ok || !sessionToken){
          setStatus('Le lien de connexion est invalide ou expiré. Merci de demander un nouveau lien.');
          return;
        }

        window.localStorage.setItem('apam_session_token', sessionToken);
        window.localStorage.setItem('apam_member_authenticated_at', String(Date.now()));
        setStatus('Connexion validée. Redirection...');
        window.history.replaceState({}, '', window.location.pathname);
        window.location.href = next;
      } catch (error) {
        const reason = error && error.message ? ` (${error.message})` : '';
        setStatus(`Impossible de valider le lien${reason}.`);
      }
    }

    form?.addEventListener('submit', async (event) => {
      event.preventDefault();
      const apiUrl = String(window.APAM_ACCESS_API_URL || panel?.dataset.accessApi || '').trim();
      if (!apiUrl){
        setStatus('Le service est temporairement indisponible.');
        return;
      }

      const email = String(form.email.value || '').trim().toLowerCase();
      if (!email){
        setStatus('Merci de renseigner votre email.');
        return;
      }

      setStatus('Envoi du lien en cours...');
      window.localStorage.setItem('apam_login_next', next);

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'request_magic_link', email })
        });
        let payload = {};
        const contentType = String(res.headers.get('content-type') || '').toLowerCase();
        if (contentType.includes('application/json')) {
          payload = await res.json();
        } else {
          const rawText = await res.text();
          payload = { ok: false, error: rawText || 'invalid_response' };
        }

        if (!res.ok) {
          if (res.status === 401 || res.status === 403) {
            setStatus('Accès refusé par Apps Script (403). Vérifiez le déploiement Web App : accès "Toute personne ayant le lien".');
            return;
          }
          setStatus('Le service de connexion est indisponible pour le moment.');
          return;
        }

        if (!payload.ok){
          const detail = payload && payload.error ? ` (${payload.error})` : '';
          setStatus(`Connexion refusée${detail}.`);
          return;
        }

        setStatus('Lien envoyé. Vérifiez votre boîte mail (et les indésirables).');
      } catch (error) {
        const reason = error && error.message ? ` (${error.message})` : '';
        setStatus(`Impossible de contacter le serveur de connexion${reason}. Vérifiez le déploiement Apps Script (Web App publiée + accès "Toute personne ayant le lien").`);
      }
    });

    consumeMagicLinkIfNeeded();
  </script>

  <script>
    window.COOKIE_CONSENT_CONFIG = window.COOKIE_CONSENT_CONFIG || { gaMeasurementId: "{{GA_MEASUREMENT_ID}}" };
  </script>
  <script src="assets/cookie-consent.js" defer></script>
</body>
</html>

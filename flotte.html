<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APAM – Flotte</title>
  <link rel="stylesheet" href="assets/hangar-intro.css" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111318;
      color: #f2f4f7;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 4rem 1.2rem 5rem;
    }
    h1 { margin-bottom: 1rem; }
    .cards {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    }
    .card {
      background: #1b1f27;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Notre flotte</h1>
    <p>Découvre nos avions école et voyage.</p>
    <section class="cards">
      <article class="card"><h2>DR400</h2><p>Avion d'initiation polyvalent.</p></article>
      <article class="card"><h2>PA-28</h2><p>Confortable pour les navigations.</p></article>
      <article class="card"><h2>C152</h2><p>Classique pour la formation.</p></article>
    </section>
  </main>

  <script src="assets/hangar-intro.js" defer></script>
</body>
</html>

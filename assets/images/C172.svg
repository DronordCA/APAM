      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.5" stop-color="#d7dde3"/>
      <stop offset="1" stop-color="#aab4bd"/>
    </linearGradient>
    <linearGradient id="c172wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf1"/>
      <stop offset="1" stop-color="#bcc6ce"/>

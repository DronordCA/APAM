<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/apam-logo.png" />
  <link rel="shortcut icon" href="assets/images/apam-logo.png" />
  <title>APAM – Connexion membres</title>
  <style>
    :root{--accent:#2f6bff;--line:rgba(255,255,255,.16);--bg:#11131a;--surface:rgba(20,22,34,.92);}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100svh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top right,#203768,#11131a 44%);color:#fff;padding:20px;}
    .panel{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);padding:28px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
    h1{font-size:36px;line-height:1.05;text-transform:uppercase;letter-spacing:-.02em;margin-bottom:10px}
    p{color:rgba(255,255,255,.76);line-height:1.5;margin-bottom:18px}
    form{display:grid;gap:12px}
    label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.8)}
    input{width:100%;padding:12px;border:1px solid var(--line);background:#0f1220;color:#fff}
    button{padding:12px 14px;border:1px solid rgba(123,166,255,.55);background:linear-gradient(135deg,#2f6bff,#183775);color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
    .status{margin-top:14px;font-size:13px;min-height:20px;color:#bcd2ff}
    .help{margin-top:14px;font-size:12px;color:rgba(255,255,255,.63)}
    a{color:#c8dbff}
    .loading-overlay{position:fixed;inset:0;background:rgba(8,10,18,.76);display:none;place-items:center;z-index:1200;backdrop-filter:blur(3px)}
    .loading-box{display:grid;gap:12px;place-items:center;padding:20px 24px;border:1px solid var(--line);background:rgba(20,22,34,.95)}
    .spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.2);border-top-color:#7fa5ff;border-radius:50%;animation:spin .9s linear infinite}
    .loading-text{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#d7e4ff}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="panel" data-access-api="https://script.google.com/macros/s/AKfycbxmzpzMhv5wEaSajCkNYu6bpQbqwkb7klq029Yjo_3KNKMmyTtNdSEF_R0vgAUK9_-9/exec">
    <h1>Connexion membres</h1>
    <p>Entrez votre email APAM et votre mot de passe. La session sécurisée vous redirige ensuite vers l'espace membres.</p>

    <form id="loginForm" novalidate>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div>
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit">Se connecter</button>
    </form>

    <div class="status" id="status" aria-live="polite"></div>
    <p class="help">Besoin d'un compte ? <a href="inscription-membres.html">Remplissez le formulaire d'inscription interne APAM</a>.</p>
    <p class="help"><a href="index.html">← Retour à l'accueil</a></p>
  </main>

  <div class="loading-overlay" id="loadingOverlay" aria-live="polite" aria-hidden="true">
    <div class="loading-box">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-text">Connexion en cours...</div>
    </div>
  </div>

  <script src="assets/access-config.js"></script>

  <script>
    const panel = document.querySelector('[data-access-api]');
    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const next = (params.get('next') || 'mon-compte.html').replace(/^\//, '');
    const loadingOverlay = document.getElementById('loadingOverlay');

    function setStatus(message){
      if (status) status.textContent = message;
    }

    function setLoading(isLoading){
      if (!loadingOverlay) return;
      loadingOverlay.style.display = isLoading ? 'grid' : 'none';
      loadingOverlay.setAttribute('aria-hidden', isLoading ? 'false' : 'true');
    }

    form?.addEventListener('submit', async (event) => {
      event.preventDefault();
      const apiUrl = String(window.APAM_ACCESS_API_URL || panel?.dataset.accessApi || '').trim();
      if (!apiUrl){
        setStatus('Le service est temporairement indisponible.');
        return;
      }

      const email = String(form.email.value || '').trim().toLowerCase();
      const password = String(form.password.value || '');
      if (!email || !password){
        setStatus('Merci de renseigner email et mot de passe.');
        return;
      }

      setStatus('');
      setLoading(true);

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          // Requête CORS simple (sans préflight OPTIONS) pour Apps Script.
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', email, password })
        });
        let payload = {};
        const contentType = String(res.headers.get('content-type') || '').toLowerCase();
        if (contentType.includes('application/json')) {
          payload = await res.json();
        } else {
          const rawText = await res.text();
          payload = { ok: false, error: rawText || 'invalid_response' };
        }

        if (!res.ok) {
          if (res.status === 401 || res.status === 403) {
            setLoading(false);
            setStatus('Accès refusé par Apps Script (403). Vérifiez le déploiement Web App : accès "Toute personne ayant le lien".');
            return;
          }
          setLoading(false);
          setStatus('Le service de connexion est indisponible pour le moment.');
          return;
        }

        const sessionToken = String(payload.token || payload.sessionToken || '').trim();

        if (!payload.ok || !sessionToken){
          if (payload.error === 'invalid_credentials') {
            setLoading(false);
            setStatus('Identifiants incorrects.');
            return;
          }
          if (payload.error === 'ACTION_INVALIDE') {
            setLoading(false);
            setStatus('Connexion refusée : le serveur Apps Script actif ne prend pas en charge l\'action "login". Vérifiez l\'URL de déploiement active.');
            return;
          }
          const detail = payload && payload.error ? ` (${payload.error})` : '';
          setLoading(false);
          setStatus(`Connexion refusée${detail}.`);
          return;
        }

        window.localStorage.setItem('apam_session_token', sessionToken);
        setStatus('Connexion validée. Redirection...');
        window.location.href = next;
      } catch (error) {
        setLoading(false);
        const reason = error && error.message ? ` (${error.message})` : '';
        setStatus(`Impossible de contacter le serveur de connexion${reason}. Vérifiez le déploiement Apps Script (Web App publiée + accès "Toute personne ayant le lien").`);
      }
    });
  </script>

  <script>
    window.COOKIE_CONSENT_CONFIG = window.COOKIE_CONSENT_CONFIG || { gaMeasurementId: "{{GA_MEASUREMENT_ID}}" };
  </script>
  <script src="assets/cookie-consent.js" defer></script>
</body>
</html>
